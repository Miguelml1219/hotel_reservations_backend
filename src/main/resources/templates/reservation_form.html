<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Reservation</title>
    <meta charset="UTF-8" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="container mt-5">
<h2 class="mb-4">Reservation Form</h2>

<form th:action="@{/hotel/reservation/web}" th:object="${reservation}" method="post" class="row g-3">

    <div class="col-md-6">
        <label class="form-label">Name</label>
        <input type="text" th:field="*{name}" class="form-control" required />
    </div>

    <div class="col-md-6">
        <label class="form-label">Document Type</label>
        <select th:field="*{documentType}" class="form-select">
            <option value="CC">Citizen ID</option>
            <option value="TI">Identity Card</option>
            <option value="CE">Foreigner ID</option>
            <option value="PS">Passport</option>
        </select>
    </div>

    <div class="col-md-6">
        <label class="form-label">Document Number</label>
        <input type="text" th:field="*{identification}" class="form-control" required />
    </div>

    <div class="col-md-6">
        <label class="form-label">Check-in Date</label>
        <input type="datetime-local" th:field="*{dateEntry}" class="form-control" required />
    </div>

    <div class="col-md-6">
        <label class="form-label">Check-out Date</label>
        <input type="datetime-local" th:field="*{departureDate}" class="form-control" required />
    </div>

    <div class="col-md-6">
        <label class="form-label">Room ID</label>
        <input type="text" th:field="*{room.id}" class="form-control" required />
    </div>

    <div class="col-12">
        <button type="submit" class="btn btn-primary">Book Now</button>
    </div>
</form>
<div th:if="${message}" class="mt-4 alert alert-info" th:text="${message}"></div>
</body>
</html>
